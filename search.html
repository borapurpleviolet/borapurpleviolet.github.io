---
layout: default
title: "검색 결과"
---

<h1 class="post-title" style="text-align: center; margin-bottom: 3rem;">
    "<span id="search-query" style="color: #8c5fb5;"></span>" 검색 결과
</h1>

<ul id="search-results-page" style="list-style-type: none; padding-left: 0;"></ul>

<script>
    // URL에서 검색어(q 파라미터) 추출
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');

    if (query) {
        document.getElementById('search-query').textContent = query;

        // search.json 파일 비동기 호출
        fetch('{{ site.baseurl }}/search.json')
            .then(response => response.json())
            .then(data => {
                const resultsContainer = document.getElementById('search-results-page');
                const lowerQuery = query.toLowerCase();

                // 검색어와 매칭되는 포스트 필터링 (제목, 설명, 태그 대상)
                const filteredData = data.filter(post => {
                    return post.title.toLowerCase().includes(lowerQuery) ||
                        post.description.toLowerCase().includes(lowerQuery) ||
                        post.tags.toLowerCase().includes(lowerQuery);
                });

                // 결과 렌더링
                if (filteredData.length === 0) {
                    resultsContainer.innerHTML = '<li style="text-align:center; color: var(--text-secondary);">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</li>';
                } else {
                    filteredData.forEach(post => {
                        const li = document.createElement('li');
                        li.style.marginBottom = '2.5rem';
                        li.style.paddingBottom = '1.5rem';
                        li.style.borderBottom = '1px solid rgba(255,255,255,0.1)';

                        li.innerHTML = `
              <h3 style="margin-top:0; margin-bottom: 0.5rem;">
                <a href="${post.url}" style="font-size: 1.4rem; color: var(--headings); text-decoration: none;">${post.title}</a>
              </h3>
              <p style="margin-top: 0; margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6;">
                ${post.description}
              </p>
              <span style="font-size: 0.85rem; color: rgba(255,255,255,0.5); font-weight: bold;">${post.date}</span>
            `;
                        resultsContainer.appendChild(li);
                    });
                }
            });
    } else {
        document.getElementById('search-query').textContent = '검색어 없음';
    }
</script>
