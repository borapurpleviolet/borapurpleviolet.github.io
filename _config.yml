title: Tyrian Purple
tagline: 문화유산, 예술, 음악, 커피, 식재료를 공부하고 기록하는 개인 블로그
author: bora_purple_violet
lang: ko-KR
locale: ko_KR
timezone: Asia/Seoul
url: https://borapurpleviolet.github.io # root address of the site
baseurl: ""
description: > # description of the site (multiple lines allowed)
  문화유산, 건축, 예술, 전시, 음악, 커피, 식재료, 독서를 공부하고 기록하는 개인 블로그입니다.
logo: /logo.png

permalink: /:slug

favicon: "./logo.png" # relative path to site's favicon

twitter:
  card: summary_large_image

social:
  name: Tyrian Purple
  links:
    - https://www.instagram.com/bora_purple_violet/

#theme: moonwalk # if you are using GitHub Pages, change it to remote_theme: abhinavs/moonwalk
# remote_theme: abhinavs/moonwalk

theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  appearance_toggle: true # if appearance can be switched by user
  back_home_text: "home.." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description
  show_navbar: true # show horizontal navbar
  show_footer: false # show footer links in home page,add in _data/home.yml
  show_copyright: false # show copyright notice in footer
  # following keys are using to create home layout
  show_projects: false # show projects as cards, add in _data/home.yml
  show_blog: true # show blog posts added in _posts
  show_old_projects: false # show old projects as cards, add in _data/home.yml
  show_misc_list: false # show generic vertical list for misc details, add _data/home.yml
  show_reading_time: false # show number of words and reading time in the blog posts
  show_tags: false # show tags in a blog posts
  # options for "home" page
  home:
    title_projects: Portfolio
    title_misc_list: Details
    title_blog: 
    title_old_projects: Old Projects

soopr:
  publish_token: false # sign up at https://www.soopr.co to get your publish token and personalize share and reaction options

highlighter: rouge

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 6
paginate_path: "/page:num/"

defaults:
  - scope:
      path: ""
    values:
      lang: ko-KR
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: ko-KR

exclude:
  - _backup/
  - _posts/2026-05-25-serious-art-does-not-exist.md.before_rewrite
